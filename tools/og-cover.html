<!DOCTYPE html>
<!--
  Vorlage fuer das Vorschaubild beim Teilen (img/social/og-cover.png).
  Absichtlich eine HTML-Seite statt eines Bildeditors: so kommen Schrift,
  Farben und Bildmarke direkt aus dem Projekt und bleiben mit der Website
  identisch.

  Ohne Parameter zeigt die Seite alle Entwuerfe untereinander zum Vergleichen.
  Mit ?v=1 (oder 2, 3) steht nur dieser eine da, in exakt 1200x630 - so wird
  das Bild erzeugt (Dev-Server siehe .claude/launch.json):

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=1 \
      --window-size=1200,630 --virtual-time-budget=4000 \
      --screenshot=img/social/og-cover.png \
      "http://localhost:9217/tools/og-cover.html?v=1"
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>og-cover</title>
<style>
  @font-face{font-family:'IBM Plex Sans Arabic';font-weight:500;font-display:block;src:url('/fonts/ibm-plex-sans-arabic-500.woff2') format('woff2');}
  @font-face{font-family:'IBM Plex Sans Arabic';font-weight:600;font-display:block;src:url('/fonts/ibm-plex-sans-arabic-600.woff2') format('woff2');}
  @font-face{font-family:'IBM Plex Sans Arabic';font-weight:700;font-display:block;src:url('/fonts/ibm-plex-sans-arabic-700.woff2') format('woff2');}
  @font-face{font-family:'Space Grotesk';font-weight:700;font-display:block;src:url('/fonts/space-grotesk-latin-700-normal.woff2') format('woff2');}

  :root{
    --ink:#201E1F;          /* --ink        */
    --bone:#F5F1ED;         /* --bg         */
    --muted:#585555;        /* --text-muted */
    --indigo:#685CC8;       /* --green      */
    --indigo-dim:#F0EEFA;   /* --green-dim  */
  }
  *{box-sizing:border-box;margin:0;}
  body{background:#777;display:flex;flex-direction:column;align-items:center;gap:26px;padding:26px 0;}
  body.solo{background:#FFF;padding:0;gap:0;}
  .tag{color:#FFF;font:600 15px 'IBM Plex Sans Arabic',sans-serif;}
  body.solo .tag{display:none;}

  .og{
    width:1200px; height:630px; flex:0 0 auto;
    background:var(--bone); color:var(--ink);
    font-family:'IBM Plex Sans Arabic',sans-serif;
    display:flex; flex-direction:column; justify-content:center;
    padding:0 96px; position:relative; overflow:hidden;
  }
  .brand{display:flex; align-items:center; gap:16px;
    position:absolute; top:56px; right:96px;}
  .brand img{width:62px;height:62px;}
  .brand span{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:33px;letter-spacing:-.02em;direction:ltr;}
  .title{font-size:70px;font-weight:700;line-height:1.32;letter-spacing:-.01em;}
  .sub{font-size:35px;font-weight:500;color:var(--muted);line-height:1.6;margin-top:24px;max-width:840px;}
  .url{position:absolute; bottom:56px; right:96px;
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:25px;
    color:var(--indigo); direction:ltr;}

  /* 2: alles mittig, ohne Adresse unten */
  .og.v2{text-align:center;align-items:center;padding:0 120px;}
  .og.v2 .brand{position:static;margin-bottom:46px;}
  .og.v2 .sub{margin-inline:auto;}

  /* 3: sehr heller Lilaton statt Weiss, zweite Zeile im Akzent */
  .og.v3{background:var(--indigo-dim);}
  .og.v3 .sub{color:var(--indigo);}
  .og.v3 .url{color:var(--ink);opacity:.5;}
</style>
</head>
<body>
<script>
  const only = new URLSearchParams(location.search).get('v');
  if (only) document.body.classList.add('solo');

  const MARK  = '/favicon/icon-192.png';
  const TITLE = 'كل شي بتحتاجه عن المصاري';
  const SUB   = 'حاسبات ومقارنات وكل الأدوات، مجاني وبالعربي.';
  const BRAND = `<div class="brand"><img src="${MARK}" alt=""><span>moneywithrami</span></div>`;
  const URL   = '<span class="url">moneywithrami.com</span>';

  const cards = {
    1: `<div class="og v1">${BRAND}<h1 class="title">${TITLE}</h1><p class="sub">${SUB}</p>${URL}</div>`,
    2: `<div class="og v2">${BRAND}<h1 class="title">${TITLE}</h1><p class="sub">${SUB}</p></div>`,
    3: `<div class="og v3">${BRAND}<h1 class="title">${TITLE}</h1><p class="sub">${SUB}</p>${URL}</div>`,
  };

  document.body.insertAdjacentHTML('beforeend',
    only ? cards[only]
         : Object.entries(cards).map(([n, c]) => `<div class="tag">النسخة ${n}</div>${c}`).join(''));
</script>
</body>
</html>
