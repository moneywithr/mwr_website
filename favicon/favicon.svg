<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Hintergrund -->
  <rect x="1" y="1" width="62" height="62" rx="16" fill="#CDF7BE"/>

  <!-- Bewegungslinien hinten links -->
  <path d="M6 34 L16 34 M4 40 L14 42 M7 27 L17 29" stroke="#8B72E8" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- Geldschein, schräg fliegend -->
  <g transform="translate(32,33) rotate(-18)">
    <rect x="-17" y="-11" width="34" height="22" rx="4" fill="#173C2E" stroke="#132A20" stroke-width="1.6"/>
    <rect x="-13.5" y="-7.5" width="27" height="15" rx="2.5" fill="#CDEFC2" stroke="#132A20" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="5.2" fill="#8FE07C" stroke="#132A20" stroke-width="1.2"/>
    <text x="0" y="3.1" font-family="IBM Plex Sans, Arial, sans-serif" font-weight="700" font-size="7" text-anchor="middle" fill="#132A20">€</text>
  </g>

  <!-- Orangener Akzent-Funke oben rechts, wie "Schwung" -->
  <circle cx="49" cy="15" r="3.4" fill="#FF6A3D" stroke="#132A20" stroke-width="1.3"/>

  <!-- Bewegungslinien vorne rechts unten -->
  <path d="M42 46 L52 49 M46 52 L55 56" stroke="#8B72E8" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.9"/>
</svg>
