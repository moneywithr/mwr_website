<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Broker-Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.google.com">
<link rel="preconnect" href="https://assets.finanzfluss.de">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">
</head>
<body class="lang-ar" data-i18n-title="brokerPageTitle">

<div class="top-banner">
  <div class="top-banner-inner">
    <a class="brand-name" href="/" data-i18n="brand">Money with Rami</a>
    <div class="lang-switch">
      <button class="lang-btn" data-lang="de">DE</button>
      <button class="lang-btn" data-lang="en">EN</button>
      <button class="lang-btn active" data-lang="ar">عربي</button>
    </div>
  </div>
</div>

<div class="wrap">

  <nav class="tab-nav">
    <a class="tab-btn" href="/" data-page="/" data-i18n="tabRoi">Rechner</a>
    <a class="tab-btn" href="/rechner/kostenvergleich/" data-page="/rechner/kostenvergleich/" data-i18n="tabCalculator">Kostenvergleich</a>
    <a class="tab-btn" href="/broker/" data-page="/broker/" data-i18n="tabBroker">Broker-Finder</a>
  </nav>

  <header>
    <div class="header-text">
      <div class="eyebrow" data-i18n="brokerEyebrow">أفضل المنصات حسب البلد</div>
      <h1 data-i18n="sectionBroker">وين ممكن تستثمر؟</h1>
      <p data-i18n="brokerIntro">إختر بلد إقامتك...</p>
    </div>
  </header>

  <div class="panel" id="broker-panel">
    <div class="field" style="margin-bottom:18px;">
      <div class="field-label"><span data-i18n="brokerSelectLabel">بلدك</span></div>
      <select id="broker-country"></select>
    </div>
    <div id="broker-placeholder" data-i18n="brokerPlaceholder">اختر بلدًا أعلاه لرؤية المنصات المناسبة.</div>
    <div id="broker-results" style="display:none;">
      <div class="broker-country-head">
        <h3 id="broker-result-country"></h3>
        <span class="broker-count" id="broker-result-count"></span>
      </div>
      <div id="broker-cards"></div>
      <div id="broker-general-note" class="broker-general-note" style="display:none;"></div>
    </div>
    <p class="broker-affiliate" data-i18n="brokerAffiliate">ملاحظة للشفافية...</p>
  </div>

  <footer>
    <p class="copyright">© <span id="copy-year"></span> moneywithrami — Instagram: <a href="https://www.instagram.com/moneywithrami" target="_blank" rel="noopener">@moneywithrami</a></p>
    <p class="copyright rights-reserved" data-i18n="allRightsReserved">جميع الحقوق محفوظة.</p>
  </footer>

</div>

<script src="/js/i18n.js"></script>
<script src="/js/broker-data.js"></script>
<script src="/js/common.js"></script>
<script src="/js/broker.js"></script>
</body>
</html>
